plugins {
    id 'java'
    // Gradle 9 에서는 아래 두 플러그인의 구버전이 동작하지 않는다(제거된 API 사용).
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register("aiTest", Exec) {
    group = "build setup"
    description = "CodeTest AI Agent 실행 환경 구성 (실행은 CLI에서 직접)"

    // IntelliJ 의 Gradle 창에서 눌러도 OS 에 맞는 스크립트가 돌게 한다.
    //   Windows → codetest.ps1 (PowerShell), 그 외 → codetest.sh (bash)
    // 터미널에서 직접 돌릴 때도 같은 스크립트를 쓰면 된다.
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
                    '-File', './codetest.ps1'
    } else {
        commandLine 'bash', './codetest.sh'
    }
}
